name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pip install pillow
      - name: Generate Android project
        run: |
          set -e
          mkdir -p android && cd android
          mkdir -p .
          cat > settings.gradle <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "nakhor"
          include ':app'
          EOF_0
          mkdir -p .
          cat > build.gradle <<'EOF_1'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF_1
          mkdir -p .
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_2
          mkdir -p app
          cat > app/build.gradle <<'EOF_3'
          plugins { id 'com.android.application' }
          base { archivesName = 'nakhor' }
          android {
              signingConfigs {
                  nk {
                      storeFile rootProject.file('nakhor.jks')
                      storePassword 'nakhor123'
                      keyAlias 'nakhor'
                      keyPassword 'nakhor123'
                  }
              }
              namespace 'app.nakhor'
              compileSdk 34
              defaultConfig {
                  applicationId 'app.nakhor'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  debug { signingConfig signingConfigs.nk }
                  release { minifyEnabled false; signingConfig signingConfigs.nk }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_5'
          <resources><string name="app_name">nakhor</string></resources>
          EOF_5
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF_6'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#111111</item>
                  <item name="android:statusBarColor">#111111</item>
                  <item name="android:navigationBarColor">#111111</item>
              </style>
          </resources>
          EOF_6
          mkdir -p app/src/main/java/app/nakhor
          cat > app/src/main/java/app/nakhor/MainActivity.java <<'EOF_7'
          package app.nakhor;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#111111"));
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("file".equals(u.getScheme())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
                          return true;
                      }
                  });
                  if (b == null) web.loadUrl("file:///android_asset/index.html");
                  else web.restoreState(b);
              }

              @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF_7
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_8'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@mipmap/ic_fg"/>
          </adaptive-icon>
          EOF_8
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF_9'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#111111"/></shape>
          EOF_9
          mkdir -p app/src/main/assets && cp ../index.html app/src/main/assets/index.html
          python3 - <<'EOF_PY'
          from PIL import Image
          import os
          src=Image.open('../icon.png').convert('RGB').resize((512,512))
          R='app/src/main/res/'
          def crop(n):
              c=256
              return src.crop((c-n//2,c-n//2,c+n//2,c+n//2))
          for d,px in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              os.makedirs(R+'mipmap-'+d,exist_ok=True)
              crop(400).resize((px,px),Image.LANCZOS).save(R+f'mipmap-{d}/ic_launcher.png')
              f=px*108//48
              crop(360).resize((f,f),Image.LANCZOS).save(R+f'mipmap-{d}/ic_fg.png')
          EOF_PY
          echo '' | base64 -d > nakhor.jks
          python3 - <<'EOF_OFF'
          import re,os,urllib.request
          A='app/src/main/assets/'
          UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36'
          def get(u):
              r=urllib.request.Request(u,headers={'User-Agent':UA})
              return urllib.request.urlopen(r,timeout=60).read()
          tw=get('https://cdn.tailwindcss.com/3.4.17')
          assert len(tw)>50000,'tailwind download failed'
          open(A+'tailwind.js','wb').write(tw)
          h=open(A+'index.html',encoding='utf-8').read()
          m=re.search(r'<link href="(https://fonts.googleapis.com/css2[^"]+)"[^>]*>',h)
          assert m,'fonts link not found'
          css=get(m.group(1)).decode()
          os.makedirs(A+'fonts',exist_ok=True)
          urls=sorted(set(re.findall(r'url\((https://[^)]+)\)',css)))
          assert urls,'no font urls'
          for i,u in enumerate(urls):
              ext=u.split('?')[0].rsplit('.',1)[-1]
              n=f'f{i}.{ext}'
              open(A+'fonts/'+n,'wb').write(get(u))
              css=css.replace(u,n)
          assert 'https://' not in re.sub(r'/\*.*?\*/','',css,flags=re.S),'remote url left in css'
          open(A+'fonts/fonts.css','w',encoding='utf-8').write(css)
          h=h.replace(m.group(0),'<link href="fonts/fonts.css" rel="stylesheet">')
          h=re.sub(r'<link rel="preconnect"[^>]*>\s*','',h)
          h=h.replace('<script src="https://cdn.tailwindcss.com"></script>','<script src="tailwind.js"></script>')
          assert 'cdn.tailwindcss.com' not in h and 'fonts.googleapis' not in h
          open(A+'index.html','w',encoding='utf-8').write(h)
          print('bundled',len(urls),'font files')
          EOF_OFF

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: nakhor-apk
          path: android/app/build/outputs/apk/debug/nakhor-debug.apk
